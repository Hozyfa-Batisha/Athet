<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A4F40">
<title>سبورة تفاعلية · أثر</title>
<script>
(function(){
  var t=null;
  try{ t=localStorage.getItem('theme'); }catch(e){}
  if(!t){ t=(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'; }
  if(t==='dark') document.documentElement.classList.add('dark');
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F2E6; --card:#FFFDF6; --brand:#0E6B55; --brand-d:#0A4F40;
  --gold:#C9A24B; --gold-l:#F6F1E2; --ink:#333; --line:rgba(14,107,85,.14);
}
html.dark{
  --bg:#0B1512; --card:#10211C; --brand:#0E6B55; --brand-d:#0A4F40;
  --gold:#7A6532; --gold-l:#172B25; --ink:#ece3d6; --line:rgba(227,194,122,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas#board{position:fixed;inset:0;width:100vw;height:100dvh;display:block;cursor:crosshair}
canvas#board.erase{cursor:cell}
canvas#board.hand{cursor:default}
canvas#board.text{cursor:text}

#title{position:fixed;top:14px;right:18px;font:800 1.15rem 'Reem Kufi','Cairo',sans-serif;color:var(--brand);pointer-events:none;z-index:5}
html.dark #title{color:#E3C27A}

#bar{
  position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center;
  background:var(--card);border:2px solid var(--gold);border-radius:18px;padding:8px 10px;
  box-shadow:0 8px 24px rgba(10,79,64,.18);max-width:calc(100vw - 16px);z-index:10;
}
.grp{display:flex;align-items:center;gap:4px;padding:0 6px}
.grp:first-child{border:0}

.btn{
  width:42px;height:42px;border-radius:12px;border:2px solid transparent;background:transparent;color:var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,border-color .15s,color .15s,transform .12s;flex-shrink:0;
}
.btn:hover{background:var(--gold-l);border-color:var(--gold)}
.btn:active{transform:scale(.94)}
.btn.on{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 2px 8px rgba(14,107,85,.35)}
.btn:disabled{opacity:.35;cursor:not-allowed;background:transparent;border-color:transparent}
.btn.danger:hover{background:#fde8e8;border-color:#e0a0a0;color:#b42318}
.btn.trash-over,.btn.armed{background:#fde8e8;border-color:#dc2626;color:#b42318;transform:scale(1.15)}
.btn svg,.ic svg{width:22px;height:22px;display:block}
.ic{display:flex}

.txt{
  height:42px;padding:0 12px;border-radius:12px;border:2px solid var(--gold);background:var(--card);color:var(--brand-d);
  font:700 .92rem 'Cairo',sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.15s;flex-shrink:0;
}
.txt svg{width:20px;height:20px}
.txt:hover{background:var(--gold-l)}
.txt.on{background:var(--brand);color:#fff;border-color:var(--brand)}
html.dark .txt{color:#E8CE8F}

.sw{
  width:30px;height:30px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--gold);
  cursor:pointer;transition:transform .12s;padding:0;flex-shrink:0;
}
.sw:hover{transform:scale(1.12)}
.sw.on{box-shadow:0 0 0 3px var(--brand)}
.sw.auto{background:linear-gradient(135deg,#1F2A24 50%,#F1E8DB 50%)}
#picker{width:30px;height:30px;border:2px solid var(--gold);border-radius:50%;padding:0;background:none;cursor:pointer;overflow:hidden;flex-shrink:0}
#picker::-webkit-color-swatch-wrapper{padding:0}
#picker::-webkit-color-swatch{border:0;border-radius:50%}

.size{display:flex;align-items:center;gap:8px;padding:0 6px}
input[type=range]{width:110px;accent-color:var(--brand);cursor:pointer}
#dot{display:block;border-radius:50%;background:#1F2A24;width:10px;height:10px;flex-shrink:0;transition:width .15s,height .15s}

#hint{
  position:fixed;top:56px;left:50%;transform:translateX(-50%);background:var(--brand-d);color:#fff;
  padding:8px 18px;border-radius:12px;font:700 .9rem 'Cairo',sans-serif;opacity:0;transition:opacity .3s;
  pointer-events:none;z-index:20;white-space:nowrap;
}

#editor{
  position:fixed;display:none;z-index:15;min-width:140px;min-height:1.4em;resize:none;overflow:hidden;
  background:rgba(255,255,255,.6);border:2px dashed var(--brand);border-radius:6px;padding:2px 6px;outline:none;
  font-family:'Cairo',sans-serif;font-weight:700;line-height:1.25;color:#1F2A24;direction:auto;
}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}

#menu{
  position:fixed;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 74px);left:50%;
  transform:translateX(-50%) translateY(10px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  display:flex;gap:6px;background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:8px;
  box-shadow:0 8px 24px rgba(10,79,64,.18);z-index:11;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center;
}
#menu.open{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.mi{
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;border-radius:12px;
  border:2px solid transparent;background:transparent;cursor:pointer;font:700 .82rem 'Cairo',sans-serif;color:var(--brand-d);transition:.15s;
}
.mi:hover{background:var(--gold-l);border-color:var(--gold);transform:translateY(-2px)}
.mi .e{font-size:1.6rem;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
html.dark .mi{color:#E8CE8F}
#burger.on{background:var(--brand);color:#fff;border-color:var(--brand)}

@media (max-width:640px){
  #title{display:none}
  .btn{width:38px;height:38px}
  .btn svg,.ic svg{width:20px;height:20px}
  .sw{width:26px;height:26px}
  .txt{height:38px;padding:0 8px;font-size:.82rem}
  input[type=range]{width:70px}
  .grp{padding:0 3px}
}
@media (max-width:900px) and (max-height:500px) and (orientation:landscape){
  #title{display:none}
  #bar{
    left:10px;right:10px;bottom:max(7px,env(safe-area-inset-bottom));
    transform:none;width:auto;max-width:none;min-height:54px;
    flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;overflow-y:hidden;
    padding:5px 8px;scrollbar-width:thin;overscroll-behavior-inline:contain;
  }
  .grp{flex:0 0 auto}
  .btn{width:40px;height:40px}
  #menu{bottom:68px;max-height:calc(100dvh - 80px);overflow-y:auto}
}
</style>
<script src="/js/ui-language.js?v=2"></script>
</head>
<body>

<div id="title">سبورة أثر</div>
<canvas id="board"></canvas>
<canvas id="fx"></canvas>
<textarea id="editor" rows="1" aria-label="اكتب النص"></textarea>
<div id="hint"></div>

<div id="menu"></div>
<div id="bar" role="toolbar" aria-label="أدوات السبورة">
  <div class="grp">
    <button id="burger" class="btn" title="قائمة المؤثرات"><span class="ic" data-icon="menu"></span></button>
  </div>
  <div class="grp">
    <button class="btn on" data-tool="pen" title="قلم عادي (P)"><span class="ic" data-icon="pen"></span></button>
    <button class="btn" data-tool="calligraphy" title="قلم خط عربي (C)"><span class="ic" data-icon="nib"></span></button>
    <button class="btn" data-tool="eraser" title="ممحاة (E)"><span class="ic" data-icon="eraser"></span></button>
    <button class="btn" data-tool="text" title="كتابة نص (X)"><span class="ic" data-icon="text"></span></button>
  </div>
  <div class="grp">
    <button class="btn" data-tool="hand" title="يد: تحريك وتكبير وتصغير (V)"><span class="ic" data-icon="hand"></span></button>
    <button class="btn" data-tool="line" title="خط (L)"><span class="ic" data-icon="line"></span></button>
    <button class="btn" data-tool="rect" title="مربع (R)"><span class="ic" data-icon="rect"></span></button>
    <button class="btn" data-tool="circle" title="دائرة (O)"><span class="ic" data-icon="circle"></span></button>
    <button class="btn" data-tool="triangle" title="مثلث (G)"><span class="ic" data-icon="triangle"></span></button>
    <button class="btn" data-tool="star" title="نجمة (S)"><span class="ic" data-icon="star"></span></button>
    <button class="btn" data-tool="arrow" title="سهم (A)"><span class="ic" data-icon="arrow"></span></button>
    <button id="fillBtn" class="txt" title="تعبئة الأشكال"><span class="ic" data-icon="fill"></span>تعبئة</button>
  </div>
  <div class="grp" id="swatches"></div>
  <div class="grp size">
    <span id="dot"></span>
    <input type="range" id="size" min="1" max="50" value="6" aria-label="حجم الخط">
  </div>
  <div class="grp">
    <button class="btn on" data-bg="plain" title="خلفية بيضاء"><span class="ic" data-icon="plain"></span></button>
    <button class="btn" data-bg="grid" title="خلفية مربعات"><span class="ic" data-icon="grid"></span></button>
    <button class="btn" data-bg="lines" title="خلفية أسطر"><span class="ic" data-icon="lines"></span></button>
  </div>
  <div class="grp">
    <button id="undo" class="btn" title="تراجع (Ctrl+Z)"><span class="ic" data-icon="undo"></span></button>
    <button id="redo" class="btn" title="إعادة (Ctrl+Y)"><span class="ic" data-icon="redo"></span></button>
    <button id="trash" class="btn danger" title="سلة المهملات: اضغط لحذف المحدد، أو اسحب شيئاً عليها"><span class="ic" data-icon="trash"></span></button>
    <button id="save" class="btn" title="حفظ كصورة"><span class="ic" data-icon="download"></span></button>
  </div>
</div>

<script>
(function(){
  const ICONS = {
    pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
    nib:'<path d="M5 19c3-1 6-4 8-9l3-5 2 2-5 3c-5 2-8 5-8 9z"/><path d="M5 19l5-5"/>',
    eraser:'<path d="M20 20H9.5"/><path d="M3.5 14.5l9.6-9.6a2 2 0 0 1 2.8 0l4.6 4.6a2 2 0 0 1 0 2.8L11 19.5a2 2 0 0 1-2.8 0l-3.2-3.2a2 2 0 0 1 0-2.8z"/>',
    text:'<path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/>',
    hand:'<path d="M18 11V6a2 2 0 0 0-4 0"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-5.7-2.5L3.4 16a2 2 0 0 1 3.2-2.4L8 15"/>',
    line:'<path d="M5 19L19 5"/>',
    rect:'<rect x="4" y="5" width="16" height="14" rx="2"/>',
    circle:'<circle cx="12" cy="12" r="8"/>',
    triangle:'<path d="M12 4l9 16H3z"/>',
    star:'<path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9l-5.2 2.6 1-5.8-4.2-4.1 5.8-.8z"/>',
    arrow:'<path d="M5 19L19 5"/><path d="M9 5h10v10"/>',
    fill:'<rect x="4" y="4" width="16" height="16" rx="3" fill="currentColor" fill-opacity=".25"/><rect x="4" y="4" width="16" height="16" rx="3"/>',
    plain:'<rect x="4" y="4" width="16" height="16" rx="3"/>',
    grid:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>',
    lines:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 8h18M3 12h18M3 16h18"/>',
    undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
    redo:'<path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/>',
    del:'<path d="M9 9l6 6M15 9l-6 6"/><circle cx="12" cy="12" r="9"/>',
    trash:'<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/>',
    menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
    download:'<path d="M12 4v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/>'
  };
  document.querySelectorAll('[data-icon]').forEach(el => {
    el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[el.dataset.icon] + '</svg>';
  });

  const cv = document.getElementById('board');
  const ctx = cv.getContext('2d');
  const ink = document.createElement('canvas'), ik = ink.getContext('2d');
  const ov  = document.createElement('canvas'), ok = ov.getContext('2d');
  const hint = document.getElementById('hint');
  const sizeIn = document.getElementById('size');
  const dot = document.getElementById('dot');
  const fillBtn = document.getElementById('fillBtn');
  const editor = document.getElementById('editor');

  const COLORS = ['auto', '#0E6B55', '#dc2626', '#2563eb', '#eab308', '#9333ea', '#f97316'];
  const TOOL_NAMES = { pen:'قلم عادي', calligraphy:'قلم خط عربي', eraser:'ممحاة', text:'نص', hand:'يد: تحريك وتكبير', line:'خط', rect:'مربع', circle:'دائرة', triangle:'مثلث', star:'نجمة', arrow:'سهم' };
  const SHAPES = ['line','rect','circle','triangle','star','arrow'];
  const PAD = 6, HR = 9;

  const S = { tool:'pen', color:'auto', size:6, fill:false, bg:'plain', strokes:[], sel:null, past:[], future:[] };
  let cur = null, mode = 'none', W = 0, H = 0, DPR = 1, toastT = null;
  let lastClient = { x: 0, y: 0 }, origObj = null, ob = null, startP = null, hi = -1, snapped = false, editing = false, editP = null;

  const clone = arr => arr.map(s => JSON.parse(JSON.stringify(s)));
  const snap = () => { S.past.push(clone(S.strokes)); if (S.past.length > 80) S.past.shift(); S.future = []; };
  const resolve = c => c === 'auto' ? '#1F2A24' : c;   // الخلفية بيضاء دايماً، فاللون التلقائي غامق

  function toast(msg){
    hint.textContent = msg; hint.style.opacity = 1;
    clearTimeout(toastT); toastT = setTimeout(() => hint.style.opacity = 0, 1500);
  }

  /* ---------- الرسم ---------- */
  function paintSeg(g, s, a, b){
    g.save();
    g.lineCap = 'round'; g.lineJoin = 'round';
    if (s.type === 'eraser'){
      g.globalCompositeOperation = 'destination-out';
      g.strokeStyle = '#000'; g.lineWidth = s.size * 2.2;
    } else if (s.type === 'calligraphy'){
      // رأس مائل كما في قلم الخط العربي بالسبورة القديمة.
      g.fillStyle = resolve(s.color);
      const dist = Math.hypot(b.x - a.x, b.y - a.y);
      const steps = Math.max(Math.ceil(dist / 2), 1);
      const nibWidth = s.size * 3;
      for (let i = 0; i < steps; i++){
        const x = a.x + (b.x - a.x) * (i / steps);
        const y = a.y + (b.y - a.y) * (i / steps);
        g.save(); g.translate(x, y); g.rotate(-Math.PI / 4);
        g.fillRect(-nibWidth / 2, -1, nibWidth, 2.5); g.restore();
      }
      g.restore(); return;
    } else {
      // قلم عادي: السمك بيقل مع سرعة الرسم عشان الخط يبقى أنيق وطبيعي
      const d = Math.hypot(b.x - a.x, b.y - a.y);
      const target = s.size * Math.max(0.55, 1 - Math.min(d, 30) / 45);
      s._w = s._w == null ? target : s._w + (target - s._w) * 0.3;
      g.strokeStyle = resolve(s.color); g.lineWidth = Math.max(1, s._w);
    }
    g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
    g.restore();
  }

  function paintDot(g, s, p){
    g.save();
    if (s.type === 'eraser'){ g.globalCompositeOperation = 'destination-out'; g.fillStyle = '#000'; }
    else if (s.type === 'calligraphy'){
      g.fillStyle = resolve(s.color); g.translate(p.x,p.y); g.rotate(-Math.PI / 4);
      g.fillRect(-s.size * 1.5,-1,s.size * 3,2.5); g.restore(); return;
    }
    else g.fillStyle = resolve(s.color);
    const r = s.type === 'eraser' ? s.size * 1.1 : Math.max(0.5, s.size / 2);
    g.beginPath(); g.arc(p.x, p.y, r, 0, Math.PI * 2); g.fill();
    g.restore();
  }

  function drawShape(g, s){
    const { x1, y1, x2, y2 } = s;
    g.save();
    g.strokeStyle = resolve(s.color); g.fillStyle = resolve(s.color);
    g.lineWidth = s.size; g.lineCap = 'round'; g.lineJoin = 'round';
    const w = x2 - x1, h = y2 - y1;
    g.beginPath();
    if (s.type === 'line'){
      g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
    } else if (s.type === 'arrow'){
      g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
      const ang = Math.atan2(h, w), head = Math.max(14, s.size * 3);
      g.beginPath();
      g.moveTo(x2 - head * Math.cos(ang - Math.PI / 6), y2 - head * Math.sin(ang - Math.PI / 6));
      g.lineTo(x2, y2);
      g.lineTo(x2 - head * Math.cos(ang + Math.PI / 6), y2 - head * Math.sin(ang + Math.PI / 6));
      g.stroke();
    } else {
      if (s.type === 'rect'){
        g.rect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(w), Math.abs(h));
      } else if (s.type === 'circle'){
        g.ellipse((x1 + x2) / 2, (y1 + y2) / 2, Math.abs(w) / 2, Math.abs(h) / 2, 0, 0, Math.PI * 2);
      } else if (s.type === 'triangle'){
        g.moveTo((x1 + x2) / 2, Math.min(y1, y2)); g.lineTo(Math.max(x1, x2), Math.max(y1, y2)); g.lineTo(Math.min(x1, x2), Math.max(y1, y2)); g.closePath();
      } else if (s.type === 'star'){
        const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
        const R = Math.min(Math.abs(w), Math.abs(h)) / 2, r = R * 0.5;
        for (let i = 0; i < 10; i++){
          const rad = i % 2 ? r : R, a = -Math.PI / 2 + i * Math.PI / 5;
          const px = cx + Math.cos(a) * rad, py = cy + Math.sin(a) * rad;
          i ? g.lineTo(px, py) : g.moveTo(px, py);
        }
        g.closePath();
      }
      if (s.fill){ g.globalAlpha = 0.3; g.fill(); g.globalAlpha = 1; }
      g.stroke();
    }
    g.restore();
  }

  function textLines(s){ return String(s.text).split('\n'); }

  function drawText(g, s){
    const px = s.size * 3;
    g.save();
    g.font = `700 ${px}px Cairo, sans-serif`;
    g.fillStyle = resolve(s.color); g.textBaseline = 'top'; g.textAlign = 'left';
    textLines(s).forEach((l, i) => g.fillText(l, s.x, s.y + i * px * 1.25));
    g.restore();
  }

  function renderStroke(g, s){
    if (s.type === 'text') return drawText(g, s);
    if (SHAPES.includes(s.type)) return drawShape(g, s);
    s._w = undefined;
    if (s.pts.length === 1) return paintDot(g, s, s.pts[0]);
    for (let i = 1; i < s.pts.length; i++) paintSeg(g, s, s.pts[i - 1], s.pts[i]);
  }

  /* ---------- الحدود والاختيار ---------- */
  function bounds(s){
    if (s.type === 'text'){
      const px = s.size * 3;
      ik.font = `700 ${px}px Cairo, sans-serif`;
      const lines = textLines(s);
      const w = Math.max(px * 0.5, ...lines.map(l => ik.measureText(l).width));
      return { x: s.x, y: s.y, w, h: lines.length * px * 1.25 };
    }
    if (SHAPES.includes(s.type)){
      return { x: Math.min(s.x1, s.x2), y: Math.min(s.y1, s.y2), w: Math.abs(s.x2 - s.x1), h: Math.abs(s.y2 - s.y1) };
    }
    const xs = s.pts.map(p => p.x), ys = s.pts.map(p => p.y);
    const x = Math.min(...xs), y = Math.min(...ys);
    return { x, y, w: Math.max(...xs) - x, h: Math.max(...ys) - y };
  }

  function corners(b){
    return [
      { x: b.x - PAD, y: b.y - PAD }, { x: b.x + b.w + PAD, y: b.y - PAD },
      { x: b.x + b.w + PAD, y: b.y + b.h + PAD }, { x: b.x - PAD, y: b.y + b.h + PAD }
    ];
  }

  function handleAt(p){
    if (!S.sel) return -1;
    const cs = corners(bounds(S.sel));
    for (let i = 0; i < 4; i++) if (Math.hypot(p.x - cs[i].x, p.y - cs[i].y) <= HR + 4) return i;
    return -1;
  }

  function distSeg(p, a, b){
    const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy;
    let t = l2 ? ((p.x - a.x) * dx + (p.y - a.y) * dy) / l2 : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
  }

  function hitTest(p){
    for (let i = S.strokes.length - 1; i >= 0; i--){
      const s = S.strokes[i];
      if (s.pts){
        const tol = s.size / 2 + 8;
        if (s.pts.length === 1 && Math.hypot(p.x - s.pts[0].x, p.y - s.pts[0].y) <= tol) return s;
        for (let k = 1; k < s.pts.length; k++) if (distSeg(p, s.pts[k - 1], s.pts[k]) <= tol) return s;
      } else {
        const b = bounds(s), m = 10;
        if (p.x >= b.x - m && p.x <= b.x + b.w + m && p.y >= b.y - m && p.y <= b.y + b.h + m) return s;
      }
    }
    return null;
  }

  // تحويل الكائن من حدوده الأصلية إلى حدود جديدة (تحريك أو تكبير)
  function transformInto(target, orig, from, to){
    const sx = to.w / Math.max(from.w, 1), sy = to.h / Math.max(from.h, 1);
    const mx = x => to.x + (x - from.x) * sx;
    const my = y => to.y + (y - from.y) * sy;
    const o = JSON.parse(JSON.stringify(orig));
    if (o.type === 'text'){
      o.x = mx(o.x); o.y = my(o.y);
      o.size = Math.max(4, orig.size * sy);
    } else if (SHAPES.includes(o.type)){
      o.x1 = mx(o.x1); o.x2 = mx(o.x2); o.y1 = my(o.y1); o.y2 = my(o.y2);
    } else {
      o.pts = o.pts.map(p => ({ x: mx(p.x), y: my(p.y) }));
    }
    Object.keys(target).forEach(k => delete target[k]);
    Object.assign(target, o);
  }

  /* ---------- العرض ---------- */
  function drawBg(g){
    g.fillStyle = '#FFFFFF';
    g.fillRect(0, 0, W, H);
    if (S.bg === 'plain') return;
    g.strokeStyle = 'rgba(14,107,85,.34)';
    g.lineWidth = 1.5;
    g.beginPath();
    if (S.bg === 'grid'){
      for (let x = 0; x <= W; x += 32){ g.moveTo(x + .5, 0); g.lineTo(x + .5, H); }
      for (let y = 0; y <= H; y += 32){ g.moveTo(0, y + .5); g.lineTo(W, y + .5); }
    } else {
      for (let y = 44; y < H; y += 36){ g.moveTo(0, y + .5); g.lineTo(W, y + .5); }
    }
    g.stroke();
    if (S.bg === 'grid'){
      g.strokeStyle = 'rgba(10,79,64,.48)';
      g.lineWidth = 2;
      g.beginPath();
      for (let x = 0; x <= W; x += 128){ g.moveTo(x + .5, 0); g.lineTo(x + .5, H); }
      for (let y = 0; y <= H; y += 128){ g.moveTo(0, y + .5); g.lineTo(W, y + .5); }
      g.stroke();
    }
  }

  function drawSelection(){
    if (!S.sel) return;
    const b = bounds(S.sel);
    ctx.save();
    ctx.strokeStyle = '#0E6B55'; ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 4]);
    ctx.strokeRect(b.x - PAD, b.y - PAD, b.w + PAD * 2, b.h + PAD * 2);
    ctx.setLineDash([]);
    ctx.fillStyle = '#fff';
    for (const c of corners(b)){
      ctx.beginPath(); ctx.rect(c.x - HR / 2, c.y - HR / 2, HR, HR); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }

  function replay(){
    ik.clearRect(0, 0, W, H);
    for (const s of S.strokes) renderStroke(ik, s);
  }

  function compose(){
    ctx.clearRect(0, 0, W, H);
    drawBg(ctx);
    ctx.drawImage(ink, 0, 0, W, H);
    ctx.drawImage(ov, 0, 0, W, H);
    drawSelection();
    updateButtons();
  }

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    for (const c of [cv, ink, ov]){ c.width = W * DPR; c.height = H * DPR; }
    if (typeof fxEl !== 'undefined'){ fxEl.width = W * DPR; fxEl.height = H * DPR; fxc.setTransform(DPR, 0, 0, DPR, 0, 0); }
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    for (const g of [ctx, ik, ok]) g.setTransform(DPR, 0, 0, DPR, 0, 0);
    replay(); compose();
  }

  /* ---------- الإدخال ---------- */
  const pt = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };

  cv.addEventListener('pointerdown', e => {
    if (e.button === 2) return;
    const p = pt(e);
    lastClient = { x: e.clientX, y: e.clientY };
    if (editing) commitText();

    if (S.tool === 'text'){ openEditor(p); return; }

    cv.setPointerCapture(e.pointerId);

    if (S.tool === 'hand'){
      hi = handleAt(p);
      if (hi >= 0){
        mode = 'resize';
      } else {
        const obj = hitTest(p);
        S.sel = obj;
        if (!obj){ compose(); return; }
        mode = 'move';
      }
      origObj = JSON.parse(JSON.stringify(S.sel));
      ob = bounds(S.sel);
      startP = p; snapped = false;
      compose();
      return;
    }

    mode = 'draw';
    S.sel = null;
    const base = { type: S.tool, color: S.color, size: S.size, fill: S.fill };
    if (SHAPES.includes(S.tool)){
      cur = { ...base, x1: p.x, y1: p.y, x2: p.x, y2: p.y };
    } else {
      cur = { ...base, pts: [p] };
      paintDot(ik, cur, p);
    }
    compose();
  });

  cv.addEventListener('pointermove', e => {
    const p = pt(e);
    if (mode === 'move' || mode === 'resize'){
      if (!snapped){ snap(); snapped = true; }
      let to;
      if (mode === 'move'){
        const dx = p.x - startP.x, dy = p.y - startP.y;
        to = { x: ob.x + dx, y: ob.y + dy, w: ob.w, h: ob.h };
      } else {
        const a = corners(ob)[(hi + 2) % 4];
        const bx = corners(ob)[hi];
        const nx = Math.min(a.x, p.x), ny = Math.min(a.y, p.y);
        to = { x: nx, y: ny, w: Math.max(6, Math.abs(p.x - a.x)), h: Math.max(6, Math.abs(p.y - a.y)) };
        if (bx){ /* مرساة الزاوية المقابلة */ }
      }
      transformInto(S.sel, origObj, ob, to);
      lastClient = { x: e.clientX, y: e.clientY };
      document.getElementById('trash').classList.toggle('trash-over', mode === 'move' && overTrash(lastClient));
      replay(); compose();
      return;
    }
    if (mode !== 'draw' || !cur) return;
    if (SHAPES.includes(cur.type)){
      cur.x2 = p.x; cur.y2 = p.y;
      ok.clearRect(0, 0, W, H);
      drawShape(ok, cur);
    } else {
      const last = cur.pts[cur.pts.length - 1];
      if (Math.hypot(p.x - last.x, p.y - last.y) < 1.2) return;
      cur.pts.push(p);
      paintSeg(ik, cur, last, p);
    }
    compose();
  });

  function endPointer(){
    if (mode === 'draw' && cur){
      ok.clearRect(0, 0, W, H);
      const isShape = SHAPES.includes(cur.type);
      if (!isShape || Math.abs(cur.x2 - cur.x1) > 2 || Math.abs(cur.y2 - cur.y1) > 2){
        snap();
        if (isShape) drawShape(ik, cur);
        S.strokes.push(cur);
      }
      cur = null;
    }
    if (mode === 'move' && snapped && overTrash(lastClient)) removeSel();
    document.getElementById('trash').classList.remove('trash-over');
    mode = 'none'; snapped = false;
    compose();
  }
  cv.addEventListener('pointerup', endPointer);
  cv.addEventListener('pointercancel', endPointer);
  cv.addEventListener('contextmenu', e => e.preventDefault());

  /* ---------- النص ---------- */
  function openEditor(p){
    editing = true; editP = p;
    editor.value = '';
    editor.style.left = p.x + 'px';
    editor.style.top = p.y + 'px';
    editor.style.fontSize = (S.size * 3) + 'px';
    editor.style.color = resolve(S.color);
    editor.style.display = 'block';
    editor.focus();
  }
  function closeEditor(){
    editing = false;
    editor.style.display = 'none';
  }
  function commitText(){
    if (!editing) return;
    const t = editor.value;
    const p = editP;
    closeEditor();
    if (t.trim()){
      snap();
      S.strokes.push({ type:'text', color:S.color, size:S.size, x:p.x, y:p.y, text:t });
      replay(); compose();
    }
  }
  editor.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); commitText(); }
    else if (e.key === 'Escape'){ closeEditor(); }
    e.stopPropagation();
  });
  editor.addEventListener('blur', commitText);
  editor.addEventListener('input', () => {
    editor.style.height = 'auto';
    editor.style.height = editor.scrollHeight + 'px';
    editor.style.width = Math.max(140, editor.scrollWidth + 4) + 'px';
  });

  /* ---------- التراجع والإعادة والحذف ---------- */
  function undo(){
    if (!S.past.length) return;
    S.future.push(clone(S.strokes));
    S.strokes = S.past.pop();
    S.sel = null; replay(); compose();
  }
  function redo(){
    if (!S.future.length) return;
    S.past.push(clone(S.strokes));
    S.strokes = S.future.pop();
    S.sel = null; replay(); compose();
  }
  let armedT = null, armed = false;
  function overTrash(c){
    const r = document.getElementById('trash').getBoundingClientRect();
    return c.x >= r.left && c.x <= r.right && c.y >= r.top && c.y <= r.bottom;
  }
  function removeSel(){
    S.strokes = S.strokes.filter(s => s !== S.sel);
    S.sel = null; replay(); compose(); toast('تم الحذف');
  }
  function deleteSel(){
    if (!S.sel) return toast('اختر شيئاً بالأداة اليد أولاً');
    snap(); removeSel();
  }
  function clearAll(){
    snap();
    S.strokes = []; S.sel = null;
    replay(); compose(); toast('تم مسح السبورة');
  }
  // الزر: لو فيه محدد يتحذف، وإلا اضغط مرتين عشان تمسح الكل (من غير نوافذ المتصفح)
  function trashClick(){
    const btn = document.getElementById('trash');
    if (S.sel){ deleteSel(); return; }
    if (!S.strokes.length) return toast('سلة المهملات فاضية');
    if (!armed){
      armed = true; btn.classList.add('armed');
      toast('اضغط مرة أخرى لمسح كل الرسم');
      clearTimeout(armedT);
      armedT = setTimeout(() => { armed = false; btn.classList.remove('armed'); }, 2500);
      return;
    }
    armed = false; btn.classList.remove('armed'); clearTimeout(armedT);
    clearAll();
  }
  function save(){
    const out = document.createElement('canvas');
    out.width = W * DPR; out.height = H * DPR;
    const g = out.getContext('2d');
    g.scale(DPR, DPR);
    drawBg(g);
    g.drawImage(ink, 0, 0, W, H);
    const a = document.createElement('a');
    a.download = 'سبورة-أثر.png';
    a.href = out.toDataURL('image/png');
    a.click();
    toast('تم حفظ الصورة');
  }

  function updateButtons(){
    document.getElementById('undo').disabled = !S.past.length;
    document.getElementById('redo').disabled = !S.future.length;
  }

  /* ---------- واجهة الشريط ---------- */
  function setTool(t){
    if (editing) commitText();
    S.tool = t;
    if (t !== 'hand') S.sel = null;
    document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
    cv.className = t === 'eraser' ? 'erase' : t === 'hand' ? 'hand' : t === 'text' ? 'text' : '';
    toast(TOOL_NAMES[t]);
    compose();
  }
  document.querySelectorAll('[data-tool]').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));

  const sw = document.getElementById('swatches');
  const picker = document.createElement('input');
  picker.type = 'color'; picker.id = 'picker'; picker.value = '#0E6B55'; picker.title = 'لون مخصص';
  COLORS.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'sw' + (c === 'auto' ? ' auto' : '') + (i === 0 ? ' on' : '');
    if (c !== 'auto') b.style.background = c;
    b.title = c === 'auto' ? 'لون تلقائي (غامق)' : c;
    b.addEventListener('click', () => {
      S.color = c;
      sw.querySelectorAll('.sw').forEach(x => x.classList.toggle('on', x === b));
      if (c !== 'auto') picker.value = c;
      updateDot();
    });
    sw.appendChild(b);
  });
  picker.addEventListener('input', e => {
    S.color = e.target.value;
    sw.querySelectorAll('.sw').forEach(x => x.classList.remove('on'));
    updateDot();
  });
  sw.appendChild(picker);

  function updateDot(){
    const d = Math.max(4, Math.min(34, S.size));
    dot.style.width = dot.style.height = d + 'px';
    dot.style.background = resolve(S.color);
  }
  sizeIn.addEventListener('input', () => {
    S.size = +sizeIn.value; updateDot();
    if (S.sel && S.sel.type === 'text'){
      // تغيير الحجم من الشريط يطبق على النص المحدد
      snap(); S.sel.size = S.size; replay(); compose();
    }
  });

  fillBtn.addEventListener('click', () => {
    S.fill = !S.fill;
    fillBtn.classList.toggle('on', S.fill);
    toast(S.fill ? 'الأشكال بتعبئة' : 'الأشكال بدون تعبئة');
  });

  document.querySelectorAll('[data-bg]').forEach(b => b.addEventListener('click', () => {
    S.bg = b.dataset.bg;
    document.querySelectorAll('[data-bg]').forEach(x => x.classList.toggle('on', x === b));
    compose();
  }));

  document.getElementById('undo').addEventListener('click', undo);
  document.getElementById('redo').addEventListener('click', redo);
  document.getElementById('trash').addEventListener('click', trashClick);
  document.getElementById('save').addEventListener('click', save);

  window.addEventListener('keydown', e => {
    if (editing) return;
    const k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && k === 'z'){ e.preventDefault(); undo(); return; }
    if ((e.ctrlKey || e.metaKey) && k === 'y'){ e.preventDefault(); redo(); return; }
    if (e.key === 'Delete' || e.key === 'Backspace'){ if (S.sel){ e.preventDefault(); deleteSel(); } return; }
    if (e.key === 'Escape'){ S.sel = null; compose(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const map = { p:'pen', c:'calligraphy', e:'eraser', x:'text', v:'hand', l:'line', r:'rect', o:'circle', g:'triangle', s:'star', a:'arrow' };
    if (map[k]) setTool(map[k]);
  });

  new MutationObserver(() => { updateDot(); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

  /* ---------- القائمة والأصوات والمؤثرات ---------- */
  const fxEl = document.getElementById('fx'), fxc = fxEl.getContext('2d');
  const menu = document.getElementById('menu');
  const burger = document.getElementById('burger');
  const particles = [];
  let actx = null, fxRunning = false;

  function audio(){
    if (!actx){
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, t0, dur, type, vol, endFreq){
    const a = audio(); if (!a) return;
    const t = a.currentTime + t0;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noiseBurst(t0, dur, freq, vol){
    const a = audio(); if (!a) return;
    const len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.9;
    const g = a.createGain(); g.gain.value = vol;
    src.connect(f).connect(g).connect(a.destination);
    src.start(a.currentTime + t0);
  }

  const SOUNDS = {
    clap(){ for (let i = 0; i < 12; i++) noiseBurst(Math.random() * 1.2, 0.08, 1400 + Math.random() * 1200, 0.7); },
    sad(){ tone(392, 0, 1.4, 'triangle', 0.3, 196); tone(330, 0.05, 1.3, 'sine', 0.12, 165); },
    happy(){ [523, 659, 784, 1046].forEach((f, i) => tone(f, i * 0.11, 0.35, 'triangle', 0.26)); },
    stars(){ [1318, 1568, 2093, 1760, 2349].forEach((f, i) => tone(f, i * 0.07, 0.5, 'sine', 0.14)); },
    pop(){ noiseBurst(0, 0.12, 2500, 0.5); tone(880, 0.02, 0.4, 'sine', 0.15, 1760); }
  };

  const CONF = ['#0E6B55', '#C9A24B', '#dc2626', '#2563eb', '#eab308', '#9333ea', '#f97316', '#ec4899'];
  const EMOJI = { sad:['😢','😞','😭','🥀'], happy:['😄','😁','🥳','😍','🤩'], clap:['👏','🙌'] };
  const COUNT = { stars:24, sad:16, happy:16, surprise:90, clap:14 };
  const MAX_P = 420;
  const sprites = new Map();
  // نرسم الإيموجي والنجوم مرة واحدة ونخزنها، وبعدين بنستخدم الصورة الجاهزة في كل إطار
  function getSprite(key, px, draw){
    const k = key + ':' + px;
    if (sprites.has(k)) return sprites.get(k);
    const c = document.createElement('canvas');
    c.width = c.height = Math.ceil(px * 2);
    const g = c.getContext('2d');
    g.scale(2, 2); g.translate(px / 2, px / 2);
    draw(g, px);
    sprites.set(k, c);
    return c;
  }

  function spawn(kind){
    const n = COUNT[kind];
    for (let i = 0; i < n; i++){
      const p = {
        x: Math.random() * W, y: -30 - Math.random() * H * 0.45,
        vx: (Math.random() - 0.5) * 1.6, vy: 1 + Math.random() * 2.5,
        rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.12,
        sway: Math.random() * 6, t: 0
      };
      if (kind === 'stars'){
        p.kind = 'star'; p.size = 18 + Math.random() * 18; p.color = ['#F5C542', '#FFD84D', '#E8A917'][i % 3];
        const starColor = p.color;
        p.sprite = getSprite('star' + starColor, Math.round(p.size), (g, s) => drawStar(g, s / 2, starColor));
      } else if (kind === 'surprise'){
        p.kind = 'confetti'; p.size = 9 + Math.random() * 7; p.color = CONF[i % CONF.length];
        p.vy = 1.5 + Math.random() * 3; p.vr *= 3;
      } else {
        p.kind = 'emoji'; p.size = 26 + Math.random() * 14; p.ch = EMOJI[kind][i % EMOJI[kind].length];
        const ch = p.ch;
        p.sprite = getSprite(ch, Math.round(p.size), (g, s) => {
          g.font = `${s}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
          g.textAlign = 'center'; g.textBaseline = 'middle';
          g.fillText(ch, 0, 0);
        });
      }
      particles.push(p);
      if (particles.length > MAX_P) particles.shift();
    }
    if (!fxRunning){ fxRunning = true; requestAnimationFrame(frame); }
  }

  function drawStar(g, R, color){
    g.beginPath();
    for (let i = 0; i < 10; i++){
      const r = i % 2 ? R * 0.5 : R, a = -Math.PI / 2 + i * Math.PI / 5;
      i ? g.lineTo(Math.cos(a) * r, Math.sin(a) * r) : g.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    g.closePath();
    g.fillStyle = color; g.fill();
    g.strokeStyle = '#B7791F'; g.lineWidth = 1; g.stroke();
  }

  function frame(){
    fxc.clearRect(0, 0, W, H);
    for (let i = particles.length - 1; i >= 0; i--){
      const p = particles[i];
      p.vy += 0.035; p.vx *= 0.995;
      p.x += p.vx + Math.sin(p.t * 0.05 + p.sway) * 0.6;
      p.y += p.vy; p.rot += p.vr; p.t++;
      if (p.y > H + 60){ particles.splice(i, 1); continue; }
      fxc.save();
      fxc.translate(p.x, p.y); fxc.rotate(p.rot);
      if (p.sprite) fxc.drawImage(p.sprite, -p.size / 2, -p.size / 2, p.size, p.size);
      else if (p.kind === 'confetti'){
        fxc.fillStyle = p.color;
        fxc.fillRect(-p.size / 2, -p.size / 4, p.size, Math.max(1, p.size / 2 * Math.abs(Math.cos(p.t * 0.2))));
      } else {
        fxc.font = `${p.size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
        fxc.textAlign = 'center'; fxc.textBaseline = 'middle';
        fxc.fillText(p.ch, 0, 0);
      }
      fxc.restore();
    }
    if (particles.length) requestAnimationFrame(frame);
    else { fxRunning = false; fxc.clearRect(0, 0, W, H); }

    source.start(audioStart,0,Math.min(2,buffer.duration));frameId=requestAnimationFrame(frame);
  }
  const MENU = [
    { label:'الكرباج', icon:'🪢', run(){ triggerWhip(); } },
    { label:'نجوم', icon:'⭐', run(){ SOUNDS.stars(); spawn('stars'); } },
    { label:'حزن', icon:'😢', run(){ SOUNDS.sad(); spawn('sad'); } },
    { label:'فرح', icon:'😄', run(){ SOUNDS.happy(); spawn('happy'); } },
    { label:'مفاجأة', icon:'🎉', run(){ SOUNDS.pop(); spawn('surprise'); } },
    { label:'تصفيق', icon:'👏', run(){ SOUNDS.clap(); spawn('clap'); } }
  ];

  let lastRun = 0;
  MENU.forEach(m => {
    const b = document.createElement('button');
    b.className = 'mi';
    b.innerHTML = '<span class="e">' + m.icon + '</span>' + m.label;
    b.addEventListener('click', () => {
      closeMenu();
      const now = performance.now();
      if (now - lastRun < 120) return;
      lastRun = now;
      m.run();
    });
    menu.appendChild(b);
  });

  function closeMenu(){ menu.classList.remove('open'); burger.classList.remove('on'); }
  burger.addEventListener('click', e => {
    e.stopPropagation();
    const open = !menu.classList.contains('open');
    menu.classList.toggle('open', open);
    burger.classList.toggle('on', open);
  });
  document.addEventListener('click', e => {
    if (!menu.contains(e.target) && e.target !== burger && !burger.contains(e.target)) closeMenu();
  });

  window.addEventListener('resize', resize);
  setTool('pen');
  updateDot();
  resize();
  toast('ارسم بالماوس أو باللمس، والشريط في الأسفل');
  document.fonts?.ready.then(() => { replay(); compose(); });
})();
</script>
</body>
</html>
