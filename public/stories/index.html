<style>
:root{--ink:#fffdf5;--muted:#f1f5e9;--green:#164f41;--gold:#f4c65e}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Cairo,Tahoma,Arial,sans-serif;color:var(--ink);background:transparent}body{min-height:100vh;position:relative;background:#183e39 url("/stories/%D9%82%D8%B5%D8%B5-%D8%A7%D9%84%D8%AE%D9%84%D9%81%D9%8A%D8%A9.png") center center / cover fixed no-repeat}body::before{content:"";position:fixed;inset:0;background:rgba(8,35,33,.20);pointer-events:none;z-index:0}main{position:relative;z-index:1}main{max-width:1220px;margin:0 auto;padding:20px 20px 34px}.hero{margin:0 auto 16px;text-align:center;color:#fff;padding:8px 14px 14px;text-shadow:0 2px 9px #082d28}.eyebrow{font-weight:800;font-size:14px;color:#fff2bf}.hero h1{font-size:clamp(27px,4vw,39px);font-weight:900;margin:2px 0 3px}.hero p{font-weight:700;line-height:1.7;margin:0;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.story-card{position:relative;isolation:isolate;min-height:220px;aspect-ratio:3/2;border:0;border-radius:17px;overflow:hidden;cursor:pointer;box-shadow:0 8px 22px #071c1b52;transition:transform .18s,box-shadow .18s;background:#15364b}.story-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px #071c1b78}.story-card:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.story-card::before{content:"";position:absolute;inset:-14px;z-index:-2;background-image:var(--card-image);background-position:center;background-size:cover;filter:blur(14px) brightness(.52) saturate(.9);transform:scale(1.04)}.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}.story-card::after{content:"";position:absolute;inset:28% 0 0;z-index:0;background:linear-gradient(transparent,rgba(5,24,22,.9))}.card-copy{position:absolute;z-index:1;inset:auto 0 0;padding:12px 15px 14px;text-align:right}.badge{display:inline-flex;border-radius:999px;background:#f5cf68;color:#254438;padding:3px 9px;font-size:11px;font-weight:900}.story-card h2{font-size:19px;line-height:1.35;margin:6px 0 3px;color:#fff;font-weight:900;text-shadow:0 1px 5px #000}.story-card p{color:#fff;font-size:13px;font-weight:700;line-height:1.6;margin:0;text-shadow:0 1px 5px #000}.detail-shell{position:relative;width:100%;max-width:1000px;margin:0 auto;padding:0 0 18px}.top-row{display:flex;align-items:center;gap:12px;margin-bottom:6px;justify-content:flex-start}.back{display:inline-flex;align-items:center;gap:8px;margin-inline-end:auto;border:2px solid #f4c65e;border-radius:14px;padding:10px 16px;background:#092a3f;color:#fff;font-family:inherit;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 6px 18px #071c1b66;transition:background .18s,transform .18s}.back:hover{background:#16445e;transform:translateY(-1px)}.detail-heading{margin:0;font-size:clamp(23px,3.4vw,34px);font-weight:900;color:#fff;text-shadow:0 2px 8px #123}.detail-type{font-weight:800;font-size:14px;color:#fff2bf;margin:2px 0 13px}.slide{position:relative;display:grid;width:100%;grid-template-columns:60px minmax(0,960px) 60px;justify-content:center;align-items:center;gap:14px}.slide-frame{position:relative;width:100%;max-width:960px;aspect-ratio:3/2;height:auto;margin:0 auto;overflow:hidden;border-radius:20px;background:transparent;box-shadow:0 12px 32px #071c1b55}.scene-backdrop{position:absolute;inset:-3%;width:106%;height:106%;object-fit:cover;filter:blur(26px) brightness(.55) saturate(.85);transform:scale(1.04)}.slide-frame .scene-main{position:relative;z-index:1;display:block;width:100%;height:100%;object-fit:contain;transform:none;background:transparent}.slide-frame figcaption{position:absolute;z-index:2;right:50%;bottom:12px;transform:translateX(50%);padding:7px 14px;border-radius:10px;text-align:center;color:white;font-size:14px;font-weight:800;background:rgba(8,29,27,.72)}.arrow{display:grid;place-items:center;position:relative;z-index:2;width:58px;height:58px;padding:0;border:2px solid #f4c65e;border-radius:50%;background:rgba(8,34,49,.9);color:#fffdf5;cursor:pointer;box-shadow:0 8px 24px rgba(4,18,29,.38);backdrop-filter:blur(8px);transition:transform .18s,background .18s,color .18s,border-color .18s,box-shadow .18s}.arrow svg{display:block;width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.slide .arrow:hover{transform:scale(1.08);background:#f4c65e;color:#123449;border-color:#fff;box-shadow:0 10px 28px rgba(4,18,29,.48)}.slide .arrow:active{transform:scale(.96)}.arrow:disabled{opacity:.48;cursor:not-allowed;box-shadow:0 4px 12px rgba(4,18,29,.25)}.counter{text-align:center;margin:7px 0 12px;color:white;font-size:14px;font-weight:900;text-shadow:0 1px 5px #000}.story-text{max-width:900px;margin:0 auto;padding:17px 20px;border-radius:17px;background:rgba(255,253,246,.94);color:#263b38;font-size:clamp(18px,2.1vw,21px);line-height:2.05;font-weight:600;white-space:pre-line;box-shadow:0 8px 22px #071c1b40}.ending{max-width:900px;margin:12px auto 0;padding:12px 17px;border-right:4px solid #f2c452;border-radius:12px;background:rgba(16,43,62,.95);font-size:18px;line-height:1.9;font-weight:900;color:#fff}.hidden{display:none!important}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.story-card{min-height:195px}}@media(max-width:560px){main{padding:12px 10px 24px}.hero{padding:7px 6px 12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.story-card{min-height:0;aspect-ratio:3/2;border-radius:13px}.card-copy{padding:9px}.story-card h2{font-size:15px;margin:5px 0 2px}.story-card p{font-size:11px;line-height:1.45}.badge{font-size:10px}.detail-shell{position:relative;width:100%;max-width:1000px;margin:0 auto;padding:0 0 18px}.top-row{align-items:flex-start}.detail-heading{font-size:22px}.slide{grid-template-columns:42px minmax(0,1fr) 42px;gap:6px}.arrow{width:42px;height:42px}.arrow svg{width:22px;height:22px}.slide-frame{height:auto;aspect-ratio:3/2;max-height:none;min-height:0;border-radius:16px}.slide-frame img{height:100%}.story-text{padding:14px;font-size:18px}.ending{font-size:16px}}
</style>

<body><main><section id="library"><header class="hero"><div class="eyebrow">١٢ مغامرة مصوّرة</div><h1>حكايات صغيرة ومغامرات كبيرة</h1><p>اختاروا حكاية لبدء المغامرة</p></header><div id="story-grid" class="grid"></div></section><section id="detail" class="detail-shell hidden"><div class="top-row"><button id="back" class="back" type="button">↩ كل القصص</button><div><h1 id="detail-title" class="detail-heading"></h1><p id="detail-type" class="detail-type"></p></div></div><div class="slide"><button id="previous" class="arrow" type="button" aria-label="الصورة السابقة" title="الصورة السابقة"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button><figure class="slide-frame"><img id="scene-backdrop" class="scene-backdrop" alt="" aria-hidden="true"><img id="scene-image" class="scene-main" alt=""><figcaption id="scene-caption"></figcaption></figure><button id="next" class="arrow" type="button" aria-label="الصورة التالية" title="الصورة التالية"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 12H5m6-6-6 6 6 6"/></svg></button></div><div id="counter" class="counter"></div><div class="story-reading" role="group" aria-label="مشغّل القصة"><div class="story-reading-controls"><button id="story-previous" type="button" aria-label="الجملة السابقة" title="الجملة السابقة" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5l9 7-9 7zM11 5l9 7-9 7z"/></svg></button><button id="story-listen" type="button" aria-label="تشغيل القراءة" title="تشغيل القراءة"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg></button><button id="story-next" type="button" aria-label="الجملة التالية" title="الجملة التالية" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 5l-9 7 9 7zM13 5l-9 7 9 7z"/></svg></button></div><progress id="story-progress" value="0" max="1" aria-label="تقدّم قراءة القصة"></progress><p id="story-audio-status" role="status" hidden></p></div><p id="story-text" class="story-text"></p><div id="ending" class="ending"></div></section></main><script src="/data/stories-data.js"></script><script src="/data/stories-cues.js?v=1"></script><script src="/js/in-page-audio.js?v=2"></script><script src="/js/stories.js?v=7"></script></body></html>
